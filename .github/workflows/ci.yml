# CI (spec 13.3). Every Python job uses the same steps: check out the code, install uv and
# Python, install all dependency groups from uv.lock, then run one make target.
# To add a job, copy one of the Python jobs below and change its make target.
# The docker job only checks out the code and builds the image.
# Actions are pinned to full commit SHAs. Dependabot updates the SHAs and the tag comments.
name: CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --all-groups --frozen
      - run: make lint typecheck

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --all-groups --frozen
      - run: make test

  # Integration tests against Postgres and ElasticMQ (local SQS) service containers.
  # APP_TEST_DATABASE_URL and APP_TEST_SQS_ENDPOINT point the tests at them, so they start
  # no container of their own.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.4-pg18
        env:
          POSTGRES_USER: postgres
          # CI only: a test credential for this job's throwaway database, as in compose.yaml.
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready --host=127.0.0.1 --username=postgres --dbname=postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
        ports:
          - 5432:5432
      elasticmq:
        image: softwaremill/elasticmq-native:1.7.1
        options: >-
          --health-cmd "wget -q -O /dev/null http://127.0.0.1:9324/?Action=ListQueues"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
        ports:
          - 9324:9324
    env:
      APP_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      APP_TEST_SQS_ENDPOINT: http://localhost:9324
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --all-groups --frozen
      - run: uv run pytest -m integration

  # Build the container image (spec 13.5). The job does not push it.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t langgraph-postgres-starter:ci .

  # Early warning for the next Python version. A failure here does not fail the run.
  canary-3-15:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"
          enable-cache: true
      - run: uv sync --all-groups --frozen
      - run: make test
