# Evals against Claude on Bedrock (spec 12.3; P21). Normal CI (ci.yml) runs the same eval test
# with the recorded replies. This job runs it with the real model and the LLM judge, on the
# simulated adapters, writes the scorecard to the job summary, and fails when a score misses
# its threshold (src/langgraph_postgres_starter/agents/incident_triage/evals/).
#
# AWS credentials come from GitHub's OIDC provider, so no AWS key is stored. Configure:
# - the repository variable AWS_EVALS_ROLE_ARN: an IAM role that trusts this repository's
#   OIDC tokens and allows bedrock:InvokeModel. Without it the job is skipped;
# - the variable AWS_REGION (default us-east-1), and BEDROCK_MODEL_ID where the bare model ID
#   does not run in that region (for example us.anthropic.claude-opus-5-5). JUDGE_MODEL_ID is
#   the judge's model; it defaults to BEDROCK_MODEL_ID;
# - optionally the secret LANGSMITH_API_KEY (and the variable LANGSMITH_ENDPOINT outside the
#   US region): the run is then a LangSmith experiment, linked from the scorecard. The eval
#   step turns LangSmith tracing on, which langsmith's pytest plugin needs to post the run.
# Pull requests from forks get no OIDC token and no secrets, and Dependabot's pull requests
# get no Actions secrets, so the job skips them.
# Actions are pinned to full commit SHAs, the same ones as in ci.yml.
name: Evals

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Every uv command fails when uv.lock does not match pyproject.toml, as in ci.yml.
env:
  UV_LOCKED: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evals:
    if: >-
      vars.AWS_EVALS_ROLE_ARN != '' &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --all-groups
      - run: make grammars
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep
      # Last before the evals, so that only they get the credentials.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_EVALS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Evals against Bedrock
        env:
          APP_ADAPTERS: simulated
          APP_LLM_MODE: bedrock
          APP_AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          # Empty when not set: the setting keeps its default.
          APP_BEDROCK_MODEL_ID: ${{ vars.BEDROCK_MODEL_ID }}
          APP_JUDGE_MODEL_ID: ${{ vars.JUDGE_MODEL_ID }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_ENDPOINT: ${{ vars.LANGSMITH_ENDPOINT }}
          # The test turns tracing on itself when it is tracked; this says so here too.
          LANGSMITH_TRACING: "true"
        # The test appends its scorecard to APP_EVAL_SCORECARD, here the job summary, before it
        # checks the thresholds.
        run: APP_EVAL_SCORECARD="$GITHUB_STEP_SUMMARY" uv run pytest src/langgraph_postgres_starter/agents/incident_triage/evals -q
