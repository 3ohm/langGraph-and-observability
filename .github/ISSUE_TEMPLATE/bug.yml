name: Bug report
description: Something in the template does not work as documented.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. For a security problem, do not open an issue: follow SECURITY.md.
        Never paste secrets, tokens or unredacted logs.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. make setup
        2. ...
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: Logs or tracebacks, with secrets removed.
      render: shell
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.1.0 or a commit SHA
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where does it run?
      options:
        - Local (Docker Compose, simulated adapters)
        - LangGraph Studio
        - EKS (real mode)
        - CI
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version (`uv run python -V`), uv version, Docker version.
