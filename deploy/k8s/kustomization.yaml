# Example EKS manifests for the worker (spec 10.1). Render them with
# `kubectl kustomize deploy/k8s`. They are a starting point: replace each <PLACEHOLDER>
# first, and create the two Secrets that deployment.yaml and migrate-job.yaml name. No
# Secret is shipped here. There is no HPA or KEDA object: you set the replicas.
#
# The namespace must exist: kubectl create namespace langgraph-postgres-starter
#
# Order: the migrate Job needs the ConfigMap, and the worker needs the migrated schema.
# The first command applies everything except the worker:
#   kubectl apply -k deploy/k8s -l 'app.kubernetes.io/component!=worker'
#   kubectl -n langgraph-postgres-starter wait --for=condition=complete \
#     job/langgraph-postgres-starter-migrate --timeout=10m
#   kubectl apply -k deploy/k8s
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: langgraph-postgres-starter

resources:
  - serviceaccount.yaml
  - rbac.yaml
  - configmap.yaml
  - migrate-job.yaml
  - deployment.yaml

# The worker and the migrate Job run the same image (Dockerfile). Prefer a digest to a
# tag: replace newTag with `digest: sha256:<DIGEST>`.
images:
  - name: langgraph-postgres-starter
    newName: <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/langgraph-postgres-starter
    newTag: <TAG>
