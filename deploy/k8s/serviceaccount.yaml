# The worker's identity (spec 9.10). In AWS, it gets one IAM role, whose permissions
# policy is deploy/iam/policy.json (replace that file's <PLACEHOLDERS> too).
# example-agent:begin (scripts/remove_example.py deletes this block)
# In Kubernetes, rbac.yaml binds it to the read-only ClusterRole.
# example-agent:end
#
# IRSA: the annotation below names the role. The role's trust policy must trust the
# cluster's OIDC provider for system:serviceaccount:langgraph-and-observability:langgraph-and-observability.
#
# EKS Pod Identity, the alternative (it needs the EKS Pod Identity Agent add-on): delete
# the annotation, give the role a trust policy for the principal pods.eks.amazonaws.com,
# and associate the role with this ServiceAccount:
#   aws eks create-pod-identity-association --cluster-name <CLUSTER_NAME> \
#     --namespace langgraph-and-observability --service-account langgraph-and-observability \
#     --role-arn arn:aws:iam::<ACCOUNT_ID>:role/<ROLE_NAME>
apiVersion: v1
kind: ServiceAccount
metadata:
  name: langgraph-and-observability
  labels:
    app.kubernetes.io/name: langgraph-and-observability
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/<ROLE_NAME>
