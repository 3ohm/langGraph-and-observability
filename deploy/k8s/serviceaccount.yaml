# The worker's identity (spec 9.10). In Kubernetes, rbac.yaml binds it to the read-only
# ClusterRole. In AWS, it gets one IAM role, whose permissions policy is
# deploy/iam/policy.json (replace that file's <PLACEHOLDERS> too).
#
# IRSA: the annotation below names the role. The role's trust policy must trust the
# cluster's OIDC provider for system:serviceaccount:langgraph-postgres-starter:langgraph-postgres-starter.
#
# EKS Pod Identity, the alternative (it needs the EKS Pod Identity Agent add-on): delete
# the annotation, give the role a trust policy for the principal pods.eks.amazonaws.com,
# and associate the role with this ServiceAccount:
#   aws eks create-pod-identity-association --cluster-name <CLUSTER_NAME> \
#     --namespace langgraph-postgres-starter --service-account langgraph-postgres-starter \
#     --role-arn arn:aws:iam::<ACCOUNT_ID>:role/<ROLE_NAME>
apiVersion: v1
kind: ServiceAccount
metadata:
  name: langgraph-postgres-starter
  labels:
    app.kubernetes.io/name: langgraph-postgres-starter
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/<ROLE_NAME>
