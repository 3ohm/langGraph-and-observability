# ElasticMQ (local SQS) for Docker Compose (spec 6.3, 10.2 and 13.5).
# Queue URLs have the form http://localhost:9324/000000000000/<queue>. ElasticMQ finds a
# queue by the last part of the URL, so containers can use http://elasticmq:9324/... too.
include classpath("application.conf")

# The address in the queue URLs that ElasticMQ returns: reachable from the host.
node-address {
  protocol = http
  host = localhost
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

generate-node-address = false

# Account ID and region in queue URLs and ARNs.
aws {
  region = us-east-1
  accountId = "000000000000"
}

queues {
  # Input queue. After 3 receives without a delete, a message moves to incidents-dlq.
  incidents {
    defaultVisibilityTimeout = 30 seconds
    delay = 0 seconds
    receiveMessageWait = 0 seconds
    deadLettersQueue {
      name = "incidents-dlq"
      maxReceiveCount = 3
    }
  }

  incidents-dlq { }

  # Result queue (the "sqs" result sink).
  results { }
}
