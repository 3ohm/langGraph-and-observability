[project]
name = "langgraph-postgres-starter"
version = "0.1.0.dev0"
description = "Template for durable LangGraph agents on Postgres, with LangSmith tracing and an incident-triage example agent."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.5",
    "boto3>=1.43.123",
    "botocore>=1.43.123",
    "datadog-api-client>=2.62.0",
    "fastapi>=0.162.0",
    "kubernetes-asyncio>=36.1.0",
    "langchain-core>=1.7.3,<2",
    "langgraph>=1.2.19,<2",
    "langgraph-checkpoint>=4.3.1,<5",
    "langgraph-checkpoint-postgres>=3.2.0,<4",
    "langsmith>=0.14.16,<1",
    "psycopg[binary,pool]>=3.3.6",
    "psycopg-pool>=3.3.3",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    # langgraph-api (via langgraph-cli[inmem]) caps structlog<26; raise the floor when that cap is lifted.
    "structlog>=25.5.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-language-pack>=1.23.1",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
encryption = ["pycryptodome>=4.3.0"]

[dependency-groups]
dev = [
    "boto3-stubs[bedrock-runtime,ecr,sqs]>=1.43.123",
    "langgraph-cli[inmem]>=0.4.40",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "ruff>=0.17.3",
]
test = [
    "httpx>=0.28.1",
    "pycryptodome>=4.3.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "testcontainers[postgres]>=4.15.0",
    "types-pyyaml>=6.0.12.20261103",
]
evals = [
    "openevals>=0.2.2",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langgraph_postgres_starter"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.format]
# ruff also formats code blocks in Markdown. The code in docs/ is illustrative; keep it as written.
exclude = ["docs/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
# pytest checks results with plain `assert`.
"tests/**" = ["S101"]
"src/langgraph_postgres_starter/agents/**/tests/**" = ["S101"]
"src/langgraph_postgres_starter/agents/**/evals/test_*.py" = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
# Name modules from these roots: src/ for the package, the repo root for tests/.
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
# Test modules may leave test functions and fixtures unannotated.
# mypy still checks their bodies. Package code stays fully strict.
# A mypy pattern matches whole module names only, so list each eval test module by name.
module = [
    "tests.*",
    "langgraph_postgres_starter.agents.*.tests.*",
    "langgraph_postgres_starter.agents.*.evals.test_evals",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true

[tool.coverage.run]
# Also measure code that tests start in a subprocess, such as `python -m langgraph_postgres_starter`.
patch = ["subprocess"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "src/langgraph_postgres_starter/agents"]
# The repo root, so tests can import the test-only graphs as tests.graphs.
pythonpath = ["."]
markers = [
    "integration: needs Docker (Postgres and ElasticMQ containers)",
    "e2e: starts worker subprocesses",
]
# Warnings are errors. Each filter below names one known third-party warning.
filterwarnings = [
    "error",
    # langsmith calls asyncio.iscoroutinefunction, which Python 3.14 deprecates.
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:langsmith",
]
